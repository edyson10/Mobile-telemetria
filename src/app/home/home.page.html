<ion-content [fullscreen]="true">
  <main class="dashboard">
    <!-- HEADER -->
    <header class="dashboard__header">
      <div class="dashboard__brand">
        <div class="dashboard__brand-icon">🚚</div>

        <div>
          <h1>Sistema de Telemetria</h1>

          <div class="dashboard__online">
            <span class="dashboard__online-dot"></span>
            En línea
          </div>
        </div>
      </div>

      <button
        class="dashboard__notification"
        type="button"
        aria-label="Notificaciones"
      >
        🔔
      </button>
    </header>

    <!-- STATISTICS -->
    <section class="dashboard__stats">
      <!-- VEHÍCULOS -->
      <article class="stat-card">
        <div class="stat-card__header">
          <span>Vehículos</span>

          <span class="stat-card__icon stat-card__icon--green"> 🚚 </span>
        </div>

        <strong> {{ totalVehicles }} </strong>
      </article>

      <!-- ALERTAS -->
      <article class="stat-card">
        <div class="stat-card__header">
          <span>Alertas</span>

          <span class="stat-card__icon stat-card__icon--red"> ⚠ </span>
        </div>

        <strong> {{ totalAlerts }} </strong>
      </article>

      <!-- RUTAS -->
      <article class="stat-card">
        <div class="stat-card__header">
          <span>Rutas</span>

          <span class="stat-card__icon stat-card__icon--blue"> ⌁ </span>
        </div>

        <strong> — </strong>
      </article>

      <!-- DETENIDOS -->
      <article class="stat-card">
        <div class="stat-card__header">
          <span>Detenidos</span>

          <span class="stat-card__icon stat-card__icon--purple"> ⏸ </span>
        </div>

        <strong> {{ stoppedVehicles }} </strong>
      </article>
    </section>

    <!-- REAL TIME MAP -->
    <section class="map-card">
      <div class="map-card__header">
        <h2>Mapa en tiempo real</h2>

        <button
          class="map-card__location"
          type="button"
          aria-label="Centrar mapa"
        >
          ◎
        </button>
      </div>

      <div class="map-card__map">
        <!-- ROADS -->
        <div class="map-card__roads map-card__roads--one"></div>

        <div class="map-card__roads map-card__roads--two"></div>

        <div class="map-card__roads map-card__roads--three"></div>

        <div class="map-card__roads map-card__roads--four"></div>

        <!-- VEHICLES -->
        <div
          *ngFor="let vehicle of vehicles"
          class="map-card__vehicle"
          [class.map-card__vehicle--green]="vehicle.status === 'MOVING'"
          [class.map-card__vehicle--red]="vehicle.status === 'STOPPED'"
          [style.left]="vehiclePositions.get(vehicle.id)?.left"
          [style.top]="vehiclePositions.get(vehicle.id)?.top"
        >
          🚚
        </div>

        <!-- MAP CONTROL -->
        <button
          class="map-card__control"
          type="button"
          aria-label="Centrar ubicación"
        >
          ◎
        </button>
      </div>
    </section>

    <!-- BOTTOM NAVIGATION -->
    <app-bottom-navigation />
  </main>
</ion-content>
