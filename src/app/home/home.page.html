<ion-content [fullscreen]="true">
  <main class="dashboard">
    <!-- Header -->
    <header class="dashboard__header">
      <div class="dashboard__brand">
        <div class="dashboard__brand-icon">🚚</div>

        <div>
          <h1>Fleet Telemetry</h1>

          <div class="dashboard__online">
            <span class="dashboard__online-dot"></span>
            En línea
          </div>
        </div>
      </div>

      <button
        class="dashboard__notification"
        type="button"
        aria-label="Notificaciones"
      >
        🔔
      </button>
    </header>

    <!-- Statistics -->
    <section class="dashboard__stats">
      <article class="stat-card">
        <div class="stat-card__header">
          <span>Vehículos</span>
          <span class="stat-card__icon stat-card__icon--green"> 🚚 </span>
        </div>

        <strong>12</strong>
      </article>

      <article class="stat-card">
        <div class="stat-card__header">
          <span>Alertas</span>
          <span class="stat-card__icon stat-card__icon--red"> ⚠ </span>
        </div>

        <strong>5</strong>
      </article>

      <article class="stat-card">
        <div class="stat-card__header">
          <span>Rutas</span>
          <span class="stat-card__icon stat-card__icon--blue"> ⌁ </span>
        </div>

        <strong>8</strong>
      </article>

      <article class="stat-card">
        <div class="stat-card__header">
          <span>Detenidos</span>
          <span class="stat-card__icon stat-card__icon--purple"> ⏸ </span>
        </div>

        <strong>2</strong>
      </article>
    </section>

    <!-- Map -->
    <section class="map-card">
      <div class="map-card__header">
        <h2>Mapa en tiempo real</h2>

        <button
          class="map-card__location"
          type="button"
          aria-label="Centrar mapa"
        >
          ◎
        </button>
      </div>

      <div class="map-card__map">
        <div class="map-card__roads map-card__roads--one"></div>
        <div class="map-card__roads map-card__roads--two"></div>
        <div class="map-card__roads map-card__roads--three"></div>
        <div class="map-card__roads map-card__roads--four"></div>

        <div
          class="map-card__vehicle map-card__vehicle--green map-card__vehicle--one"
        >
          🚚
        </div>

        <div
          class="map-card__vehicle map-card__vehicle--green map-card__vehicle--two"
        >
          🚚
        </div>

        <div class="map-card__vehicle map-card__vehicle--red">🚚</div>

        <button
          class="map-card__control"
          type="button"
          aria-label="Centrar ubicación"
        >
          ◎
        </button>
      </div>
    </section>

    <!-- Bottom navigation -->
    <nav class="bottom-navigation">
      <a
        class="bottom-navigation__item bottom-navigation__item--active"
        routerLink="/home"
      >
        <span>⌂</span>
        <small>Inicio</small>
      </a>

      <a class="bottom-navigation__item" routerLink="/vehicles">
        <span>🚚</span>
        <small>Vehículos</small>
      </a>

      <a class="bottom-navigation__item" routerLink="/alerts">
        <span>⚠</span>
        <small>Alertas</small>
      </a>

      <a class="bottom-navigation__item" routerLink="/routes">
        <span>⌁</span>
        <small>Rutas</small>
      </a>

      <a class="bottom-navigation__item" routerLink="/more">
        <span>☰</span>
        <small>Más</small>
      </a>
    </nav>
  </main>
</ion-content>
